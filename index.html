<style>

:root[data-theme="dark"]{

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--ui);min-height:100%}

.top{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.6rem 1rem;border-bottom:2px solid var(--ink);position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5}
.logo{width:34px;height:34px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:.7rem}
.brand{display:flex;gap:.6rem;align-items:center}

.spacer{flex:1}

.user{display:flex;align-items:center;gap:.5rem;font-size:.88rem}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 60px)}
nav.side{border-right:2px solid var(--ink);padding:1rem .75rem;display:flex;flex-direction:column;gap:.3rem}

.count{border:1.5px solid var(--ink);border-radius:999px;padding:0 .45rem;font-size:.78rem;min-width:1.6rem;text-align:center}

.head{display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap;margin-bottom:1rem}

.box{border:2px solid var(--ink);border-radius:8px;padding:1rem;background:var(--paper)}
.box.soft{border-color:var(--line);border-style:dashed}
.box + .box{margin-top:1rem}
.box h3{margin-bottom:.6rem}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kv{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:.3rem .8rem;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.btn{border:2px solid var(--ink);background:var(--paper);padding:.45rem .9rem;border-radius:6px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--fill)}
.btn.primary{background:var(--wire);border-color:var(--wire);color:var(--wire-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-style:dashed}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:.2rem .6rem;font-size:.84rem}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
.field{display:flex;flex-direction:column;gap:.25rem;font-size:.9rem}
.field input,.field select,.field textarea{border:2px solid var(--line);border-radius:6px;padding:.4rem .55rem;background:var(--paper)}
.field textarea{min-height:130px;resize:vertical}
.field input[readonly]{background:var(--fill);border-style:dashed}
.filters{display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:1rem}
.filters .field{min-width:160px}
.chk{display:flex;gap:.5rem;align-items:flex-start;padding:.45rem 0;border-bottom:1px dashed var(--line-soft)}
.chk:last-child{border-bottom:0}
.chk input{margin-top:.25rem;width:18px;height:18px}
.ph{border:2px solid var(--line);background:
  linear-gradient(to top right,transparent calc(50% - 1px),var(--line) 50%,transparent calc(50% + 1px)),
  linear-gradient(to bottom right,transparent calc(50% - 1px),var(--line) 50%,transparent calc(50% + 1px));
  min-height:90px;display:grid;place-items:center;color:var(--muted);font-size:.85rem;border-radius:4px}
.ph span{background:var(--paper);padding:.1rem .4rem}
.fake-file{display:flex;align-items:center;gap:.6rem;border:2px dashed var(--line);border-radius:6px;padding:.6rem;font-size:.9rem}
.fake-file .ico{width:26px;height:32px;border:2px solid var(--ink);border-radius:2px;position:relative;flex:none}
.fake-file .ico::after{content:"";position:absolute;right:-2px;top:-2px;width:9px;height:9px;background:var(--paper);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink)}

/* tabla */
.tablewrap{overflow-x:auto;border:2px solid var(--ink);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:1100px;font-size:.88rem}
th,td{padding:.55rem .6rem;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
th{background:var(--fill);font-weight:700;border-bottom:2px solid var(--ink);white-space:nowrap}
tbody tr:hover{background:var(--fill-2)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.link{border:0;background:none;padding:0;color:var(--wire);text-decoration:underline;cursor:pointer;font-weight:700}
.doclink{color:var(--wire);text-decoration:underline;white-space:nowrap}
.dash{color:var(--line)}

/* estados */
.pill{display:inline-block;border:1.5px solid currentColor;border-radius:999px;padding:0 .55rem;font-size:.8rem;white-space:nowrap}
.s-rev{color:var(--ink)} .s-obs{color:var(--warn)} .s-proc{color:var(--wire)} .s-ext{color:var(--muted);border-style:dashed} .s-ok{color:var(--ok)}
.match{display:flex;align-items:center;gap:.5rem;font-weight:700}
.match.ok{color:var(--ok)} .match.bad{color:var(--bad)}
.banner{border:2px solid var(--warn);color:var(--warn);border-radius:8px;padding:.6rem .8rem;margin-bottom:1rem;background:var(--fill-2)}
.banner.info{border-color:var(--wire);color:var(--ink)}
.banner.ok{border-color:var(--ok);color:var(--ink)}

/* detalle */
.detail{display:grid;grid-template-columns:250px minmax(0,1fr) 280px;gap:1.25rem;align-items:start}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps li{position:relative;padding:0 0 1.1rem 2.6rem}
.steps li::before{content:"";position:absolute;left:15px;top:32px;bottom:0;border-left:2px dashed var(--line)}
.steps li:last-child::before{display:none}
.steps .dot{position:absolute;left:0;top:0;width:32px;height:32px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:700;background:var(--paper)}
.steps li.done .dot{background:var(--ink);color:var(--paper)}
.steps li.now .dot{border-width:3px;border-color:var(--wire);color:var(--wire);box-shadow:0 0 0 4px var(--fill)}
.steps li.ext .dot{border-style:dashed;color:var(--muted)}
.steps li.ext b{color:var(--muted)}
.steps b{display:block;font-size:.92rem}
.steps small{font-size:.8rem}
.chain{list-style:none;margin:.3rem 0 0;padding:0;font-size:.88rem}
.chain li{display:flex;gap:.5rem;align-items:center;padding:.3rem 0}
.chain .st{width:14px;height:14px;border:2px solid var(--ink);border-radius:3px;flex:none}
.chain .st.done{background:var(--ink)}
.chain .st.now{border-color:var(--wire);background:var(--wire)}
.log{list-style:none;margin:0;padding:0;font-size:.84rem}
.log li{padding:.45rem 0;border-bottom:1px dashed var(--line-soft)}
.docs{list-style:none;margin:0;padding:0;font-size:.88rem}
.docs li{display:flex;justify-content:space-between;gap:.5rem;padding:.4rem 0;border-bottom:1px dashed var(--line-soft)}
.paper{border:1.5px solid var(--line);border-radius:4px;padding:1.2rem 1.4rem;background:var(--fill-2);font-size:.9rem;max-width:68ch}
.paper .hdr{display:flex;justify-content:space-between;gap:1rem;margin-bottom:.8rem}
.paper .hdr .ph{min-height:44px;width:120px}
.paper p{margin:.45rem 0}

/* línea de tiempo */
.timeline{list-style:none;margin:0;padding:0;max-width:760px}
.timeline li{display:grid;grid-template-columns:110px 26px 1fr;gap:.8rem;padding-bottom:1.1rem;position:relative}
.timeline .d{font-size:.85rem;color:var(--muted);text-align:right;padding-top:.1rem}
.timeline .m{width:18px;height:18px;border:2px solid var(--ink);border-radius:50%;margin-top:.2rem;position:relative;background:var(--paper)}
.timeline li.done .m{background:var(--ink)}
.timeline li.pend .m{border-style:dashed;border-color:var(--line)}
.timeline li::after{content:"";position:absolute;left:calc(110px + .8rem + 8px);top:24px;bottom:0;border-left:2px solid var(--line-soft)}
.timeline li:last-child::after{display:none}

/* notas del acta (capa de anotaciones) */
.note{font-family:var(--hand);background:var(--note);color:var(--note-ink);padding:.55rem .75rem .6rem;border-radius:3px;font-size:1rem;line-height:1.35;margin:.75rem 0;transform:rotate(-.4deg);box-shadow:2px 3px 0 rgba(0,0,0,.12);max-width:62ch}
.note b{font-weight:700}
body:not(.show-notes) .note{display:none}

.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--paper);padding:.6rem 1rem;border-radius:6px;transition:opacity .2s, transform .2s;z-index:20;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{border:2px dashed var(--line);border-radius:8px;padding:2rem;text-align:center;color:var(--muted)}

@media (max-width:1180px){ .detail{grid-template-columns:220px minmax(0,1fr)} .detail aside.right{grid-column:1 / -1} }
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  nav.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:2px solid var(--ink);padding:.5rem}
  nav.side .grp{display:none}
  nav.side button{white-space:nowrap;gap:.5rem}
  .detail{grid-template-columns:1fr}
  .g2,.g3{grid-template-columns:1fr}
  main{padding:1rem}
}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>

.viewer[hidden]{display:none}
.viewer .sheet{background:var(--paper);width:min(820px,100%);max-height:100%;overflow:auto;border:2px solid var(--ink);border-radius:8px;padding:1rem 1.2rem}
.bar{height:10px;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;min-width:90px;background:var(--paper)}
.bar i{display:block;height:100%;background:var(--ink)}
mark{background:var(--note);color:var(--note-ink);padding:0 .15rem;border-radius:2px}
details summary{cursor:pointer}
.hdrawer{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;display:flex;justify-content:flex-end}

.hgrp{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:1rem 0 .3rem;border-bottom:1px dashed var(--line-soft);padding-bottom:.2rem}

@media (max-width:820px){ .cfg-plant{grid-template-columns:1fr !important} }
</style>

/* ---------- Descargas (PDF de ejemplo) ---------- */
function pdfBytes(titulo, lineas){
  const e = s => s.replace(/[\\()]/g, m => "\\"+m);
  const wrap=[]; lineas.forEach(l=>{ let t=l; while(t.length>88){ let k=t.lastIndexOf(" ",88); if(k<1)k=88; wrap.push(t.slice(0,k)); t=t.slice(k+1);} wrap.push(t); });
  let y=790, c=`BT /F1 15 Tf 56 ${y} Td (${e(titulo)}) Tj ET\n`; y-=32;
  wrap.slice(0,42).forEach(l=>{ c+=`BT /F1 11 Tf 56 ${y} Td (${e(l)}) Tj ET\n`; y-=17; });
  const objs=["<< /Type /Catalog /Pages 2 0 R >>","<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>",
    `<< /Length ${c.length} >>\nstream\n${c}endstream`,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>"];
  let out="%PDF-1.4\n"; const off=[]; objs.forEach((o,i)=>{ off.push(out.length); out+=`${i+1} 0 obj\n${o}\nendobj\n`; });
  const x=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  return Uint8Array.from(out, ch=>{ const k=ch.charCodeAt(0); return k<256?k:45; });
}
let _dl=null;
function dlCap(){ if(!_dl) _dl=(window.claude && window.claude.use) ? window.claude.use("downloads").catch(()=>null) : Promise.resolve(null); return _dl; }
async function guardar(filename, bytes, mime="application/pdf"){
  const cap=await dlCap();
  if(cap){
    try{ await cap.save({filename, data:bytes}); toast(`Descargado: ${filename}`); }
    catch(err){ toast(err&&err.code==="declined"?"Descarga cancelada.":err&&err.code==="extension_not_enabled"?"Ese formato de archivo no está disponible en esta vista.":err&&err.code==="rate_limited"?"Ya hay una descarga pendiente de confirmar.":"La descarga no está disponible en esta vista."); }
    return;
  }
  const url=URL.createObjectURL(new Blob([bytes],{type:mime}));
  const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000); toast(`Descargado: ${filename}`);
}

/* =========================================================

   ========================================================= */
let UMBRAL_DOC = 5; /* días sin movimiento para considerar un documento detenido (regla configurable) */
const ENCURSO = ["vis_esp","vis_coord","firma_sub","firmado","derivado"];
const diasEstado = d => d.mov.length ? diasDesde(d.mov[d.mov.length-1].f) : 0;
function motivoAtencion(d){
  if(d.estado==="observado") return "Observado";
  if(ui.role==="especialista" && d.estado==="vis_esp") return "Pendiente de mi visa";
  if(ENCURSO.includes(d.estado) && diasEstado(d)>=UMBRAL_DOC) return `Detenido ${diasEstado(d)} días`;
  return "";
}
const docsAtencion = () => docs.filter(d=>d.estado!=="borrador" && motivoAtencion(d));
const VISTAS_DOC = {
  atencion:{t:"Requieren atención", f:d=>!!motivoAtencion(d)},
  mivisa:{t:"Pendientes de mi visa", f:d=>d.estado==="vis_esp", esp:1},
  observado:{t:"Observados", f:d=>d.estado==="observado"},
  detenido:{t:`Detenidos (${UMBRAL_DOC}+ días)`, f:d=>ENCURSO.includes(d.estado)&&diasEstado(d)>=UMBRAL_DOC},
  "":{t:"Todos", f:()=>true}
};
function docCoincide(d){
  const p=byId(d.pid), pal=normTxt(ui.dQ).replace(/n\.?\s?°|nro\.?/g," ").split(" ").filter(Boolean);
  const hay=normTxt([d.nombre,d.sgd,p.id,p.carta].join(" "));
  return pal.every(w=>hay.includes(w))
    && (!ui.dTdoc||p.tdoc===ui.dTdoc) && (!ui.dNum.trim()||p.ndoc.startsWith(ui.dNum.trim().toUpperCase())) && coincideNombre(p.nombre, ui.dNom)
    && (!ui.dTipo||d.tipo===ui.dTipo) && (!ui.dEst||d.estado===ui.dEst) && (!ui.dEn||ED[d.estado].q===ui.dEn)
    && (!ui.dEaf||p.eaf===ui.dEaf) && (!ui.dDias||(ENCURSO.concat("observado").includes(d.estado)&&diasEstado(d)>=+ui.dDias));
}
function viewDocs(){
  const esEsp = ui.role==="especialista";
  const base = docs.filter(d=>d.estado!=="borrador" && docCoincide(d));
  if(!esEsp && ui.fED==="mivisa") ui.fED="atencion";
  const vista = VISTAS_DOC[ui.fED] ? ui.fED : "atencion";
  const list = base.filter(VISTAS_DOC[vista].f).sort((a,b)=>(!!motivoAtencion(b))-(!!motivoAtencion(a)) || diasEstado(b)-diasEstado(a));
  const tags=[ui.dTdoc&&["dTdoc",`Tipo: ${TIPOS_DOC.find(x=>x[0]===ui.dTdoc)[1]}`], ui.dNum.trim()&&["dNum",`Documento: ${ui.dNum.trim()}`], ui.dNom.trim()&&["dNom",`Nombre: ${ui.dNom.trim()}`], ui.dQ.trim()&&["dQ",`N.° de documento SGD o pedido: ${ui.dQ.trim()}`], ui.dTipo&&["dTipo",`Tipo: ${DOC_TIPO[ui.dTipo]}`], ui.dEst&&["dEst",`Estado: ${ED[ui.dEst].t}`], ui.dEn&&["dEn",`Está en: ${ui.dEn}`], ui.dEaf&&["dEaf",`EAF: ${ui.dEaf}`], ui.dDias&&["dDias",`${ui.dDias}+ días en el estado`]].filter(Boolean);
  const nMas=[ui.dTipo,ui.dEst,ui.dEn,ui.dEaf,ui.dDias].filter(Boolean).length;
  const quienes=[...new Set(Object.values(ED).map(v=>v.q).filter(q=>q!=="—"&&q!=="Analista de recaudación"))];
  return `<div class="head"><div><h1>Documentos en SGD</h1><p class="muted">Memorandos y cartas creados en el SIIP que se visan y firman en el SGD. Esta vista ayuda a detectar los que están observados o detenidos.</p></div>

  ${esEsp?`<div class="banner info">Tienes ${docs.filter(d=>d.estado==="vis_esp").length} documentos pendientes de tu visa. La visa se da en el SGD.</div>`:""}
  <div class="box" style="margin-bottom:1rem">
    <div class="filters" style="margin:0">
      <label class="field">Tipo de documento<select id="dTdoc"><option value="">Todos</option>${TIPOS_DOC.map(([k,v])=>`<option value="${k}" ${ui.dTdoc===k?"selected":""}>${v}</option>`).join("")}</select></label>
      <label class="field">Número de documento<input id="dNum" value="${esc(ui.dNum)}" placeholder="${ui.dTdoc==="DNI"?"8 dígitos":"Número"}" maxlength="${ui.dTdoc==="DNI"?8:12}" autocomplete="off"></label>
      <label class="field" style="flex:1 1 240px">Nombre del administrado<input id="dNom" value="${esc(ui.dNom)}" placeholder="Nombres y apellidos, en cualquier orden" autocomplete="off"></label>
      <label class="field" style="flex:1 1 220px">N.° de memorando, carta, registro SGD o pedido<input id="dQ" value="${esc(ui.dQ)}" placeholder="Ej.: 0514, 2026-0048, DEV-CIC-2026-015" autocomplete="off"></label></div>
    <div class="chips" role="group" aria-label="Vistas rápidas" style="margin:.8rem 0 0">
      ${Object.entries(VISTAS_DOC).filter(([k,v])=>!v.esp||esEsp).map(([k,v])=>`<button data-ed="${k}" aria-pressed="${vista===k}">${v.t}<b>${base.filter(v.f).length}</b></button>`).join("")}</div>
    <details id="dMas" ${ui.dMf?"open":""} style="margin-top:.6rem"><summary><b>Más filtros</b>${nMas?` <span class="count">${nMas}</span>`:""}</summary>
      <div class="filters" style="margin:.7rem 0 0">
        <label class="field">Tipo de documento<select id="dTipo"><option value="">Todos</option>${Object.entries(DOC_TIPO).map(([k,v])=>`<option value="${k}" ${ui.dTipo===k?"selected":""}>${v}</option>`).join("")}</select></label>

  </div>
  ${note(`<b>Propuesta UX de búsqueda:</b> se busca por la persona (tipo y número de documento, o nombre en cualquier orden) o por el documento (N.° de memorando o carta, registro SGD o pedido). Los criterios se combinan. Debajo, vistas rápidas según el trabajo${esEsp?", incluida “Pendientes de mi visa”":""}. Los criterios poco frecuentes quedan en “Más filtros”.`)}
  ${list.length?`<div class="tablewrap"><table style="min-width:1180px"><thead><tr><th>Documento</th><th>Tipo</th><th>Pedido</th><th>Administrado</th><th>EAF</th><th>Versión</th><th>Está en</th><th>Estado en SGD</th><th style="text-align:right">Días en el estado</th><th>Atención</th><th></th></tr></thead>
  <tbody>${list.map(d=>{const p=byId(d.pid), dias=diasEstado(d), mot=motivoAtencion(d), vivo=ENCURSO.includes(d.estado)||d.estado==="observado"; return `<tr>
    <td><button class="link" data-doc="${d.id}">${esc(d.nombre)}</button><br><small class="muted">${d.sgd}</small></td><td>${DOC_TIPO[d.tipo]}</td>
    <td><button class="link" data-open="${p.id}">${p.id}</button></td><td>${esc(p.nombre)}<br><small class="muted">${p.tdoc} ${p.ndoc}</small></td><td>${p.eaf}</td><td>v${d.version}</td>
    <td>${ED[d.estado].q}</td><td>${pillD(d.estado)}</td>
    <td class="num">${vivo?`<b style="${dias>=UMBRAL_DOC?"color:var(--bad)":""}">${dias}</b>`:'<span class="dash">—</span>'}</td>
    <td>${mot?`<span class="pill s-obs">${mot}</span>`:'<span class="dash">—</span>'}</td>
    <td>${dlBtn(`doc|${d.id}`)}</td></tr>`;}).join("")}</tbody></table></div>
    <p class="muted" style="margin-top:.5rem">${list.length} documentos</p>`
  :`<div class="empty">${ui.dQ.trim()||ui.dNum.trim()||ui.dNom.trim()||ui.dTdoc||nMas?"No hay documentos con esa búsqueda. Revisa el dato o quita un filtro.":vista==="atencion"?"No hay documentos que requieran atención. Todo avanza dentro del plazo.":"No hay documentos en esta vista."}</div>`}
  <details class="box soft" style="margin-top:1rem"><summary><b>Qué significa cada estado</b></summary>

}

/* ---------- Detalle de un documento ---------- */
function trackHTML(d){
  const f=FLOW[d.tipo];
  const cur = d.estado==="observado" ? f.indexOf(d.obsEn) : f.indexOf(d.estado);
  const pre = `<li class="done"><span class="m">✓</span><div><b>Creado en el SIIP</b><small class="muted">Analista de recaudación, versión ${d.version}</small></div></li>`;
  return `<ol class="track">${pre}${f.map((s,i)=>{
    let cls = i<cur?"done":i===cur?(d.estado==="observado"?"obs":"now"):"todo";
    if(i===cur && ["atendido","notificado"].includes(d.estado)) cls="done";
    const mv=[...d.mov].reverse().find(m=>m.a===MOV[s][1]||(s==="atendido"&&m.a.startsWith("Respondió"))||(s==="notificado"&&m.a.startsWith("Enviado")));
    return `<li class="${cls}"><span class="m">${cls==="done"?"✓":cls==="obs"?"!":""}</span><div><b>${cls==="obs"?"Observado en: ":""}${ED[s].t}</b><small class="muted">${cls==="done"&&mv?`${mv.f} ${mv.h}`:ED[s].q}</small></div></li>`;}).join("")}</ol>`;
}
function movHTML(d){
  return `<ul class="mov">${[...d.mov].reverse().map(m=>`<li class="${m.obs?"obs":""}"><div class="who">${m.f} ${m.h}, ${esc(m.q)}</div><div>${esc(m.a)}</div>${m.c?`<div><i>“${esc(m.c)}”</i></div>`:""}</li>`).join("")}</ul>`;
}
function anxHTML(list, spec, ver){

}

function avisoCarta(p, pre){
  const ci=cartaInfo(p.carta); if(ci.n<2) return "";
  if(!ci.pend.filter(x=>x!==p).length) return ci.est==="integra"?`<div class="banner ok">${esc(p.carta)}: sus ${ci.n} administrados están atendidos. La carta está atendida íntegramente.</div>`

function devoluciones(){

function exportarExcel(){

  const r=devoluciones(), wb=XLSX.utils.book_new();
  const det=[["Fecha de devolución","Tipo doc.","N.° doc.","Administrado","EAF","Monto (S/)","Carta de atención","Fuente"],...r.map(x=>[x.f,x.tdoc,x.ndoc,x.nombre,x.afp,+x.monto.toFixed(2),x.doc,x.fuente])];
  const porAfp={}, porMes={}; r.forEach(x=>{ (porAfp[x.afp]=porAfp[x.afp]||{n:0,p:new Set(),m:0}); porAfp[x.afp].n++; porAfp[x.afp].p.add(x.ndoc); porAfp[x.afp].m+=x.monto; const k=x.f.slice(6)+"-"+x.f.slice(3,5); (porMes[k]=porMes[k]||{n:0,m:0}); porMes[k].n++; porMes[k].m+=x.monto; });
  const res=[["Consulta de devoluciones de CIC por periodo"],["Periodo",`${ui.pDesde} a ${ui.pHasta}`],["EAF",ui.pAfp||"Todas"],["Fuente",ui.pFuente||"Todas"],[],["Devoluciones atendidas",r.length],["Personas",new Set(r.map(x=>x.ndoc)).size],["Monto devuelto (S/)",+r.reduce((s,x)=>s+x.monto,0).toFixed(2)],[],
    ["Por EAF"],["EAF","Devoluciones","Personas","Monto (S/)"],...Object.entries(porAfp).map(([a,v])=>[a,v.n,v.p.size,+v.m.toFixed(2)]),[],
    ["Por mes"],["Mes","Devoluciones","Monto (S/)"],...Object.entries(porMes).sort().map(([k,v])=>[k,v.n,+v.m.toFixed(2)])];
  const w1=XLSX.utils.aoa_to_sheet(res); w1["!cols"]=[{wch:26},{wch:16},{wch:12},{wch:16}];
  const w2=XLSX.utils.aoa_to_sheet(det); w2["!cols"]=[{wch:18},{wch:10},{wch:12},{wch:34},{wch:16},{wch:12},{wch:30},{wch:12}];
  XLSX.utils.book_append_sheet(wb,w1,"Resumen"); XLSX.utils.book_append_sheet(wb,w2,"Detalle");
  const bytes=new Uint8Array(XLSX.write(wb,{type:"array",bookType:"xlsx"}));
  return guardar(`Devoluciones CIC ${ui.pDesde} a ${ui.pHasta}.xlsx`, bytes, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
}

  buscarTraza(){
    if(ui.tModo==="nombre"){
      const norm=x=>x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
      const q=norm($("#tNombre").value); ui.tNombre=$("#tNombre").value.trim(); ui.tRes=[];

      if(pal.length<2){ ui.tMsg="Escribe al menos dos palabras del nombre completo (por ejemplo, un nombre y un apellido)."; return render(); }
      const res=personas().filter(x=>{ const n=norm(x.nombre).split(" "); return pal.every(w=>n.some(v=>v.startsWith(w))); });
      if(!res.length){ ui.tMsg=`No se encontró trazabilidad de CIC para “${ui.tNombre}”. Revisa la escritura o busca por documento.`; return render(); }
      ui.tMsg=""; ui.tRes=res.map(x=>x.ndoc); ui.traza=res[0].ndoc; return render();

  enviarRecordatorio(){ const p=byId(ui.hilo); const para=$("#rPara").value.trim(); if(!para) return toast("Indica el correo de destino.");
    addMail({pid:p.id, dir:"out", tipo:"Recordatorio", de:CFG_CORREO.casilla, para, asunto:$("#rAsunto").value.trim(), cuerpo:$("#rCuerpo").value, adjuntos:[...$("#rFiles").files].map(f=>({n:f.name,d:"Adjunto del recordatorio"})), fecha:HOY, hora:horaAhora()});
    addLog(p,"Recordatorio enviado por correo a la EAF."); toast("Recordatorio enviado. El plazo vuelve a contar."); render(); },
  escalarDesdeHilo(){ const p=byId(ui.hilo); ACTIONS.escalarCarta(p); go("detalle",{sel:p.id}); },
  simRespHilo(){ const p=byId(ui.hilo); ACTIONS.simRespuesta(p); },
  vincularMail(p,t){ const m=MAILS.find(x=>x.id===t.dataset.id), sel=document.querySelector('input[name="vinc"]:checked'); if(!sel) return toast("Elige el pedido al que corresponde el correo.");
    const q=byId(sel.value), c=checks(q), datos={};
    if(!c.cuenta){ const [b,cu,cc]=AFP_CTA[q.eaf]; Object.assign(datos,{banco:b,cuenta:cu,cci:cc}); }
    if(!c.resol) datos.resNulidad=`Res. SBS 24${30+(+q.id.slice(-2))}-2026`;
    m.pid=q.id; m.tipo="Subsanación";
    if(q.estado!=="observado"){ q.estado="observado"; q.req=q.req||{medio:"correo", fecha:m.fecha, obs:[]}; }
    q.respAFP={fecha:m.fecha, hora:m.hora, de:m.de, asunto:m.asunto, cuerpo:m.cuerpo, adjuntos:m.adjuntos, datos, aplicada:false};
    addLog(q,"Correo de la EAF vinculado manualmente como subsanación."); toast(`Correo vinculado al pedido ${q.id}.`); go("hilo",{hilo:q.id}); },
  descartarMail(p,t){ const m=MAILS.find(x=>x.id===t.dataset.id); m.descartado=true; toast("Correo descartado."); go("correos_eaf"); },
  cargarHist(){ const f=$("#histFile").files[0]; if(!f) return toast("Elige el archivo Excel del histórico."); toast(`Se validaría y cargaría ${f.name}.`); },
  crearMemo(p){ mkDoc(p,"memo"); p.estado="memo_elaboracion"; addLog(p,"Memorando a DIP creado en el SIIP."); render(); },
  guardarBorrador(p){ const d=p.estado.startsWith("memo")?docOf(p,"memo"):docOf(p,"carta_atencion"); guardarTexto(d, p.estado.startsWith("memo")?"memoTxt":"cartaTxt"); toast("Borrador guardado en el SIIP."); },
  agregarAnx(p,t){ const d=docById(t.dataset.id); guardarTexto(d, d.tipo==="memo"?"memoTxt":"cartaTxt"); const f=[...$("#nuevosAnx").files]; if(!f.length) return toast("Elige uno o más archivos.");
    f.forEach(x=>d.anexos.push({n:x.name, d:"Anexo agregado por el Analista", origen:"SIIP"})); toast(`${f.length} anexo(s) adjuntado(s).`); render(); },
  quitarAnx(p,t){ const d=docById(t.dataset.id); guardarTexto(d, d.tipo==="memo"?"memoTxt":"cartaTxt"); d.anexos.splice(+t.dataset.i,1); render(); },
  enviarMemo(p){ const d=docOf(p,"memo"); guardarTexto(d,"memoTxt"); d.fecha=HOY; registrarEnSGD(d); p.estado="memo_sgd"; addLog(p,`Memorando registrado en el SGD (${d.sgd}).`); toast("Memorando registrado en el SGD. Pasa a visación del Especialista."); render(); },
  reenviarMemo(p){ const d=docOf(p,"memo"); guardarTexto(d,"memoTxt"); d.version++; d.obs=""; d.obsEn=null; registrarEnSGD(d); p.estado="memo_sgd"; addLog(p,`Versión ${d.version} del memorando enviada al SGD.`); toast(`Versión ${d.version} registrada en el SGD.`); render(); },
  actualizar(p){ const c=mkDoc(p,"carta_atencion"); p.estado="carta_elaboracion"; p.notif={fecha:HOY}; addLog(p,"Devolución registrada en compendio."); logProc(p,HOY); toast("Devolución registrada. Ahora crea la carta de atención."); render(); },
  enviarCarta(p){ const d=docOf(p,"carta_atencion"); guardarTexto(d,"cartaTxt"); d.fecha=HOY; registrarEnSGD(d); p.estado="carta_sgd"; addLog(p,`Carta registrada en el SGD (${d.sgd}).`); toast("Carta registrada en el SGD. Pasa a visación del Especialista."); render(); },
  reenviarCarta(p){ const d=docOf(p,"carta_atencion"); guardarTexto(d,"cartaTxt"); d.version++; d.obs=""; d.obsEn=null; registrarEnSGD(d); p.estado="carta_sgd"; addLog(p,`Versión ${d.version} de la carta enviada al SGD.`); toast(`Versión ${d.version} registrada en el SGD.`); render(); },
  verTraza(p){ go("traza",{traza:p.ndoc}); },
  simAvanzar(p,t){ const d=docById(t.dataset.id); window._msgCarta=""; avanzar(d); toast(window._msgCarta?`SGD: ${ED[d.estado].t}. ${window._msgCarta}`:`SGD: ${ED[d.estado].t}.`); render(); },
  simObservar(p,t){ const d=docById(t.dataset.id); observar(d,"Revisar la redacción del segundo párrafo y el monto indicado."); toast("SGD: documento observado."); render(); }
};

/* =========================================================
   Render y eventos
   ========================================================= */
function render(){
  document.body.classList.toggle("show-notes",$("#notesToggle").checked);
  $("#userName").textContent=me();
  $("#r-analista").setAttribute("aria-pressed",ui.role==="analista");
  $("#r-especialista").setAttribute("aria-pressed",ui.role==="especialista");
  renderNav();
  $("#main").innerHTML={correos_eaf:viewCorreosEaf, hilo:viewHilo, bandeja:viewBandeja, detalle:viewDetalle, docs:viewDocs, doc:viewDoc, traza:viewTraza, periodo:viewPeriodo, correos:viewCorreos}[ui.view]();
  renderViewer(); renderHist();
  if(ui.view==="correos" && ui.cfgTab==="plantillas") actualizarPreview();
}
document.addEventListener("click", e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.dl) return descargar(t.dataset.dl);
  if(t.dataset.ver){ ui.viewer=t.dataset.ver; return renderViewer(); }
  if(t.dataset.cerrar){ ui.viewer=null; return renderViewer(); }
  if(t.dataset.persona){ const per=personas().find(x=>x.ndoc===t.dataset.persona); ui.traza=t.dataset.persona; ui.tMsg="";
    if(ui.view==="traza" && ui.tModo==="nombre" && ui.tRes.includes(t.dataset.persona)) return render();
    if(per){ ui.tModo="doc"; ui.tTipo=per.tdoc; ui.tNum=per.ndoc; ui.tRes=[]; } return go("traza"); }
  if(t.dataset.alerta){ ui.fAlerta=true; return go("bandeja"); }
  if(t.dataset.hist!==undefined){ ui.histOpen=true; ui.histCat=t.dataset.hist; return renderHist(); }
  if(t.dataset.histclose){ ui.histOpen=false; return renderHist(); }
  if(t.dataset.hilo) return go("hilo",{hilo:t.dataset.hilo});
  if(t.dataset.cfgtab){ ui.cfgTab=t.dataset.cfgtab; ui.eafNueva=false; ui.eafEdit=null; ui.eafDel=null; render(); if(ui.cfgTab==="plantillas") actualizarPreview(); return; }
  if(t.dataset.psel){ ui.pSel=t.dataset.psel; render(); actualizarPreview(); return; }
  if(t.dataset.var){ const el=$("#"+(ui.pCampo||"pCuerpo")), txt="{{"+t.dataset.var+"}}", a=el.selectionStart??el.value.length, b=el.selectionEnd??el.value.length;
    el.value=el.value.slice(0,a)+txt+el.value.slice(b); el.focus(); el.setSelectionRange(a+txt.length,a+txt.length); actualizarPreview(); return; }
  if(t.dataset.ctab){ ui.cTab=t.dataset.ctab; ui.cSel=[]; return render(); }
  if(t.dataset.dquitar){ ui[t.dataset.dquitar]=""; return render(); }
  if(t.dataset.fest!==undefined){ ui.fEstado=t.dataset.fest; return render(); }
  if(t.dataset.quitar){ const k=t.dataset.quitar; ui[k]=(k==="fAccion"||k==="fAlerta")?false:""; return render(); }
  if(t.dataset.carta){ Object.assign(ui,{agrupar:true, fRef:t.dataset.carta.replace(/^Carta N\.° /,""), fEstado:""}); return go("bandeja"); }
  if(t.dataset.ccest!==undefined){ ui.ccEst=t.dataset.ccest; return render(); }
  if(t.dataset.cest!==undefined){ ui.cEst=t.dataset.cest; return render(); }
  if(t.dataset.nav){ if(!t.closest("#main")){ if(t.dataset.nav==="docs") ui.fED="atencion"; if(t.dataset.nav==="correos_eaf") ui.cTab="atender"; } return go(t.dataset.nav); }
  if(t.dataset.open) return go("detalle",{sel:t.dataset.open});
  if(t.dataset.doc) return go("doc",{doc:t.dataset.doc});
  if(t.dataset.ed!==undefined){ ui.fED=t.dataset.ed; return render(); }
  if(t.dataset.act && ACTIONS[t.dataset.act]) ACTIONS[t.dataset.act](ui.sel&&ui.view==="detalle"?byId(ui.sel):null, t);
});
document.addEventListener("input", e=>{
  if(e.target.id==="trazaQ"){ ui.trazaQ=e.target.value; const pos=e.target.selectionStart; render(); const i=$("#trazaQ"); i.focus(); i.setSelectionRange(pos,pos); return; }
  if(e.target.id==="mCuerpo") e.target.dataset.edited="1";
  if(e.target.id==="pAsunto"||e.target.id==="pCuerpo"){ actualizarPreview(); return; }
  if(e.target.id==="nIgual"){ }
  if(e.target.id==="histQ"){ ui.histQ=e.target.value; const pos=e.target.selectionStart; renderHist(); const i=$("#histQ"); i.focus(); i.setSelectionRange(pos,pos); return; }
  if(["fNum","fNombre","fRef","dQ","dNum","dNom","cQ"].includes(e.target.id)){ const id=e.target.id; ui[id]=e.target.value; const pos=e.target.selectionStart; render(); const i=$("#"+id); i.focus(); i.setSelectionRange(pos,pos); return; }
  if(e.target.id==="fBuscar"){ ui.fBuscar=e.target.value; const pos=e.target.selectionStart; render(); const i=$("#fBuscar"); i.focus(); i.setSelectionRange(pos,pos); }
});
document.addEventListener("change", e=>{
  if(e.target.id==="fEstado"){ ui.fEstado=e.target.value; render(); }
  if(["fDesde","fHasta","fAntig"].includes(e.target.id)){ ui[e.target.id]=e.target.value; render(); }
  if(["dTdoc","dTipo","dEst","dEn","dEaf","dDias","cEaf"].includes(e.target.id)){ ui[e.target.id]=e.target.value; render(); }
  if(e.target.classList && e.target.classList.contains("csel")){ const k=e.target.dataset.key; ui.cSel=e.target.checked?[...ui.cSel,k]:ui.cSel.filter(x=>x!==k); render(); }
  if(e.target.id==="nIgual"){ const r=$("#nRes"); r.disabled=e.target.checked; if(e.target.checked) r.value=$("#nEnv").value; }
  if(e.target.id==="fAlertaChk"){ ui.fAlerta=e.target.checked; render(); }
  if(e.target.id==="fAccion"){ ui.fAccion=e.target.checked; render(); }
  if(e.target.id==="fCarta"){ ui.fCarta=e.target.value; render(); }
  if(e.target.id==="ccMulti"){ ui.ccMulti=e.target.checked; render(); }
  if(e.target.id==="fTipo"){ ui.fTipo=e.target.value; render(); }
  if(e.target.id==="fEaf"){ ui.fEaf=e.target.value; render(); }
  if(e.target.id==="trazaSel"){ ui.traza=e.target.value; render(); }
  if(["pDesde","pHasta"].includes(e.target.id)){ ui[e.target.id]=e.target.value||ui[e.target.id]; render(); }
  if(e.target.id==="tTipo"){ ui.tTipo=e.target.value; ui.tNum=$("#tNum").value; ui.tMsg=""; render(); $("#tNum").focus(); }
  if(e.target.id==="pAfp"){ ui.pAfp=e.target.value; render(); }
  if(e.target.id==="pFuente"){ ui.pFuente=e.target.value; render(); }
  if(e.target.name==="obs"){ const b=$("#mCuerpo"), p=byId(ui.sel); if(b && b.dataset.edited!=="1"){ const obs=[...document.querySelectorAll('input[name="obs"]:checked')].map(i=>i.value); b.value=cuerpoCorreo(p,obs); } }
  if(e.target.id==="notesToggle") document.body.classList.toggle("show-notes",e.target.checked);
});
$("#r-analista").onclick=()=>{ ui.role="analista"; go(ui.view==="docs"?"bandeja":ui.view); };
$("#r-especialista").onclick=()=>{ ui.role="especialista"; go(["detalle","doc","traza"].includes(ui.view)?ui.view:"docs"); };
document.addEventListener("focusin", e=>{ if(e.target.id==="pAsunto"||e.target.id==="pCuerpo") ui.pCampo=e.target.id; });
document.addEventListener("toggle", e=>{ if(e.target.id==="masFiltros") ui.mf=e.target.open; if(e.target.id==="dMas") ui.dMf=e.target.open; }, true);
marcarRecibidos();
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && (e.target.id==="tNum"||e.target.id==="tNombre")){ e.preventDefault(); ACTIONS.buscarTraza(); } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && ui.histOpen){ ui.histOpen=false; renderHist(); } });
document.getElementById("hdrawer").addEventListener("click", e=>{ if(e.target.id==="hdrawer"){ ui.histOpen=false; renderHist(); } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && ui.viewer){ ui.viewer=null; renderViewer(); } });
document.getElementById("viewer").addEventListener("click", e=>{ if(e.target.id==="viewer"){ ui.viewer=null; renderViewer(); } });
render();

</script>
</body>
</html>
